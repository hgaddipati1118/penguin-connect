<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PenguinConnect Console</title>
    <link rel="stylesheet" href="/penguin-connect/ui/app.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="rail" aria-label="Conversations">
        <header class="rail-head">
          <div>
            <p class="eyebrow">PenguinConnect</p>
            <h1>Messages</h1>
          </div>
          <button class="icon-button" id="refreshButton" type="button" title="Refresh">↻</button>
        </header>
        <div class="status-line" id="statusLine">Checking bridge…</div>
        <label class="search-box">
          <span>⌕</span>
          <input id="conversationSearch" type="search" placeholder="Search people, groups, aliases" autocomplete="off" />
        </label>
        <div class="conversation-filters" id="conversationFilters" aria-label="Conversation views">
          <button type="button" data-view="inbox">Inbox</button>
          <button type="button" data-view="pinned">Pinned</button>
          <button type="button" data-view="archived">Archived</button>
          <button type="button" data-view="all">All</button>
        </div>
        <div class="conversation-list" id="conversationList" role="list"></div>
        <section class="contacts-panel" aria-label="Contacts">
          <header class="mini-head">
            <h3>Contacts</h3>
            <button class="icon-button small-button" id="contactRefreshButton" type="button" title="Refresh contacts">↻</button>
          </header>
          <label class="search-box compact-search">
            <span>⌕</span>
            <input id="contactSearch" type="search" placeholder="Search names, phones, email" autocomplete="off" />
          </label>
          <div class="contact-status" id="contactStatus">Type to search cached Contacts</div>
          <div class="contact-list" id="contactList" role="list"></div>
        </section>
      </aside>

      <section class="thread" aria-label="Conversation">
        <header class="thread-head">
          <div>
            <p class="eyebrow" id="threadProvider">No thread selected</p>
            <h2 id="threadTitle">Select a conversation</h2>
          </div>
          <div class="thread-actions">
            <button class="quiet-button" id="syncButton" type="button">Sync</button>
            <button class="quiet-button" id="pinButton" type="button">Pin</button>
            <button class="quiet-button" id="archiveButton" type="button">Archive</button>
            <button class="quiet-button" id="markReadButton" type="button">Mark read</button>
            <button class="quiet-button" id="markUnreadButton" type="button">Mark unread</button>
            <button class="quiet-button" id="connectionButton" type="button">Disconnect</button>
            <button class="quiet-button" id="copyThreadButton" type="button">Copy thread</button>
          </div>
        </header>
        <div class="thread-status" id="threadStatus">No conversation selected</div>
        <div class="thread-management" id="threadManagement">
          <input id="threadTags" type="text" placeholder="Tags" autocomplete="off" />
          <textarea id="threadNote" rows="2" placeholder="Private note"></textarea>
          <div class="management-actions">
            <button class="quiet-button" id="saveManagementButton" type="button">Save</button>
            <span id="managementState">No thread</span>
          </div>
        </div>
        <div class="message-tools">
          <label class="message-search">
            <span>Search all synced messages</span>
            <input id="globalMessageSearch" type="search" placeholder="Text, sender, contact, attachment" autocomplete="off" />
          </label>
          <label class="message-filter">
            <span>Find in thread</span>
            <input id="messageFilter" type="search" placeholder="Filter loaded messages" autocomplete="off" />
          </label>
        </div>
        <div class="message-search-status" id="messageSearchStatus">Type 2+ chars to search local cache</div>
        <div class="message-search-results" id="messageSearchResults" aria-live="polite"></div>
        <div class="message-list" id="messageList" aria-live="polite"></div>
      </section>

      <aside class="compose" aria-label="Reply tools">
        <section class="tool-section">
          <header class="section-head">
            <h3>New chat</h3>
            <span id="draftState">Idle</span>
          </header>
          <textarea id="draftRecipients" rows="3" placeholder="Phones or emails"></textarea>
          <div class="draft-recipient-chips" id="draftRecipientChips" aria-live="polite"></div>
          <textarea id="draftMessage" rows="4" placeholder="Draft message"></textarea>
          <div class="toggle-row">
            <label><input id="draftCopyToggle" type="checkbox" checked /> Copy</label>
            <label><input id="draftOpenToggle" type="checkbox" checked /> Open Messages</label>
          </div>
          <div class="send-row">
            <button class="primary-button" id="stageDraftButton" type="button">Stage draft</button>
            <button class="quiet-button" id="clearDraftButton" type="button">Clear</button>
          </div>
        </section>

        <section class="tool-section">
          <header class="section-head">
            <h3>Create contact</h3>
            <span id="createContactState">Idle</span>
          </header>
          <div class="field-grid two-col">
            <input id="newContactFirst" type="text" placeholder="First" autocomplete="given-name" />
            <input id="newContactLast" type="text" placeholder="Last" autocomplete="family-name" />
          </div>
          <input id="newContactOrganization" type="text" placeholder="Organization" autocomplete="organization" />
          <input id="newContactPhones" type="tel" placeholder="Phones" autocomplete="tel" />
          <input id="newContactEmails" type="email" placeholder="Emails" autocomplete="email" />
          <div class="send-row">
            <button class="primary-button" id="createContactButton" type="button">Create</button>
            <button class="quiet-button" id="clearContactButton" type="button">Clear</button>
          </div>
        </section>

        <section class="tool-section">
          <header class="section-head">
            <h3>Reply</h3>
            <span id="senderBadge">No sender</span>
          </header>
          <textarea id="composer" rows="8" placeholder="Write a reply"></textarea>
          <div class="emoji-row" id="emojiRow" aria-label="Emoji shortcuts"></div>
          <div class="attachment-drop" id="attachmentDrop">
            <input id="fileInput" type="file" multiple />
            <label for="fileInput">Attach files or images</label>
          </div>
          <div class="attachment-list" id="attachmentList"></div>
          <div class="send-row">
            <button class="primary-button" id="sendButton" type="button">Send</button>
            <button class="quiet-button" id="clearButton" type="button">Clear</button>
          </div>
          <div class="send-state" id="sendState"></div>
        </section>

        <section class="tool-section">
          <header class="section-head">
            <h3>Codex</h3>
            <span id="codexCount">0 msgs</span>
          </header>
          <textarea id="codexPrompt" rows="10" readonly></textarea>
          <div class="send-row">
            <button class="quiet-button" id="buildPromptButton" type="button">Build prompt</button>
            <button class="quiet-button" id="copyPromptButton" type="button">Copy prompt</button>
          </div>
        </section>
      </aside>
    </main>
    <script src="/penguin-connect/ui/app.js"></script>
  </body>
</html>
